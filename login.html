<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Select My Venue | Venue Partner CRM</title>
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>

<style>
*{box-sizing:border-box}
html,body{width:100%;min-height:100%;margin:0}
body{
  min-height:100vh;
  font-family:Inter,-apple-system,BlinkMacSystemFont,"Segoe UI",Arial,sans-serif;
  background:#071018;
  color:#fff;
}
.login-page{
  position:fixed;inset:0;width:100vw;height:100vh;height:100dvh;
  display:flex;align-items:center;justify-content:center;
  padding:40px;overflow:auto;
  background:
    radial-gradient(circle at 50% 35%,rgba(21,154,140,.14),transparent 35%),
    radial-gradient(circle at 15% 90%,rgba(21,154,140,.08),transparent 35%),
    radial-gradient(circle at 85% 10%,rgba(255,190,70,.035),transparent 30%),
    linear-gradient(135deg,#050b12 0%,#09131d 48%,#050b12 100%);
}
.login-page::before{
  content:"";position:absolute;inset:0;pointer-events:none;opacity:.18;
  background-image:
    linear-gradient(rgba(255,255,255,.025) 1px,transparent 1px),
    linear-gradient(90deg,rgba(255,255,255,.025) 1px,transparent 1px);
  background-size:60px 60px;
}
.login-card{
  position:relative;z-index:5;width:440px;max-width:100%;
  padding:42px 44px 34px;border-radius:26px;
  background:linear-gradient(145deg,rgba(18,30,44,.97),rgba(8,17,27,.98));
  border:1px solid rgba(255,255,255,.10);
  box-shadow:0 40px 100px rgba(0,0,0,.60),0 0 80px rgba(21,154,140,.08);
  backdrop-filter:blur(18px);
}
.login-logo{
  width:86px;height:86px;margin:0 auto 22px;
  display:grid;place-items:center;border-radius:24px;
  background:linear-gradient(135deg,#23c4b5,#0d9286);
  color:#031416;font-size:23px;font-weight:950;letter-spacing:-1px;
  box-shadow:0 18px 40px rgba(13,146,134,.22);
}
.login-brand{text-align:center;margin-bottom:30px}
.login-brand h1{margin:0;font-size:27px;line-height:1.2;font-weight:800;letter-spacing:-.5px}
.login-brand p{margin:10px 0 0;font-size:13px;color:rgba(255,255,255,.55)}
.login-form{display:grid;gap:18px}
.login-field{display:grid;gap:8px}
.login-field label{font-size:11px;font-weight:800;letter-spacing:.10em;color:rgba(255,255,255,.68)}
.login-field input{
  width:100%;height:50px;padding:0 15px;border-radius:12px;
  border:1px solid rgba(255,255,255,.11);
  background:rgba(255,255,255,.045);color:#fff;outline:none;font-size:15px;
}
.login-field input::placeholder{color:rgba(255,255,255,.30)}
.login-field input:focus{
  border-color:rgba(21,154,140,.85);background:rgba(255,255,255,.06);
  box-shadow:0 0 0 3px rgba(21,154,140,.10);
}
.password-row{
  margin-top:-8px;display:flex;justify-content:flex-end;
}
.forgot-link{
  color:#31cbbb;text-decoration:none;font-size:13px;font-weight:700;
}
.forgot-link:hover{text-decoration:underline;color:#5be1d4}
.login-btn{
  width:100%;height:50px;margin-top:1px;border:0;border-radius:12px;
  cursor:pointer;font-size:15px;font-weight:800;color:#fff;
  background:linear-gradient(135deg,#18a997,#087f73);
  box-shadow:0 10px 28px rgba(8,127,115,.25);
}
.login-btn:hover{transform:translateY(-1px)}
.login-btn:disabled{opacity:.55;cursor:not-allowed;transform:none}
.login-message{min-height:20px;text-align:center;font-size:13px;line-height:1.45}
.login-message.error{color:#ff8f8f}
.login-message.success{color:#63e6be}
.login-footer{
  margin-top:27px;padding-top:20px;border-top:1px solid rgba(255,255,255,.06);
  text-align:center;font-size:10px;letter-spacing:.3px;color:rgba(255,255,255,.32);
}
@media(max-width:600px){
  .login-page{padding:24px 16px}
  .login-card{width:100%;padding:34px 25px 28px;border-radius:22px}
  .login-logo{width:72px;height:72px;border-radius:20px;font-size:20px}
  .login-brand h1{font-size:23px}
}
</style>
</head>

<body>
<main class="login-page">
  <section class="login-card">
    <div class="login-logo" aria-label="Select My Venue logo">SMV</div>

    <div class="login-brand">
      <h1>Select My Venue</h1>
      <p>Venue Partner CRM</p>
    </div>

    <form id="loginForm" class="login-form" autocomplete="on">
      <div class="login-field">
        <label for="email">EMAIL ADDRESS</label>
        <input type="email" id="email" name="email" placeholder="Enter your email"
               autocomplete="username" required>
      </div>

      <div class="login-field">
        <label for="password">PASSWORD</label>
        <input type="password" id="password" name="password" placeholder="Enter your password"
               autocomplete="current-password" required>
      </div>

      <div class="password-row">
        <a class="forgot-link" href="forgot-password.html">Forgot Password?</a>
      </div>

      <button type="submit" id="loginBtn" class="login-btn">Login to Partner CRM</button>

      <div id="loginMessage" class="login-message" role="alert" aria-live="polite"></div>
    </form>

    <div class="login-footer">Select My Venue · Secure Venue Partner Portal</div>
  </section>
</main>

<script>
window.SUPABASE_URL = "https://uajqwyoqbbswkfiwosyw.supabase.co";
window.SUPABASE_ANON_KEY = "sb_publishable_hfiuO4ZRn4VZmEkrN2RV-A_lZX_R3z7";

const supabaseLogin = window.supabase.createClient(
  window.SUPABASE_URL,
  window.SUPABASE_ANON_KEY,
  {
    auth:{
      storageKey:"smv-partner-crm-auth",
      persistSession:true,
      autoRefreshToken:true,
      detectSessionInUrl:true
    }
  }
);

const loginForm = document.getElementById("loginForm");
const loginBtn = document.getElementById("loginBtn");
const loginMessage = document.getElementById("loginMessage");

function showLoginMessage(message,type=""){
  loginMessage.textContent=message;
  loginMessage.className="login-message "+type;
}

const params = new URLSearchParams(window.location.search);
if(params.get("reset")==="success"){
  showLoginMessage("Password reset successfully. Please sign in with your new password.","success");
  history.replaceState({},document.title,"login.html");
}else if(params.get("changed")==="1"){
  showLoginMessage("Password changed successfully. Please sign in again.","success");
  history.replaceState({},document.title,"login.html");
}

loginForm.addEventListener("submit",async function(event){
  event.preventDefault();

  const email=document.getElementById("email").value.trim();
  const password=document.getElementById("password").value;

  if(!email||!password){
    showLoginMessage("Please enter email and password.","error");
    return;
  }

  loginBtn.disabled=true;
  loginBtn.textContent="Signing in...";
  showLoginMessage("");

  try{
    const result=await supabaseLogin.auth.signInWithPassword({email,password});

    if(result.error){
      showLoginMessage(result.error.message||"Invalid email or password.","error");
      return;
    }

    if(result.data?.session){
      const {data:partnerProfile,error:partnerError}=await supabaseLogin
        .from("venue_partner_profiles")
        .select("id,venue_id,user_id,full_name,designation,email,mobile,whatsapp_number,partner_role,is_primary,is_active")
        .eq("user_id",result.data.session.user.id)
        .eq("is_active",true)
        .order("is_primary",{ascending:false})
        .limit(1)
        .maybeSingle();

      if(partnerError||!partnerProfile){
        await supabaseLogin.auth.signOut();
        showLoginMessage("This account is not authorized for the Venue Partner CRM.","error");
        return;
      }

      showLoginMessage("Login successful. Opening Partner CRM...","success");
      setTimeout(()=>window.location.href="./dashboard.html",300);
    }
  }catch(error){
    console.error("Login exception:",error);
    showLoginMessage("Unable to connect to the Partner CRM. Please try again.","error");
  }finally{
    loginBtn.disabled=false;
    loginBtn.textContent="Login to Partner CRM";
  }
});

(async function(){
  try{
    const result=await supabaseLogin.auth.getSession();

    if(result.data?.session){
      const {data:partnerProfile,error:partnerError}=await supabaseLogin
        .from("venue_partner_profiles")
        .select("id")
        .eq("user_id",result.data.session.user.id)
        .eq("is_active",true)
        .limit(1)
        .maybeSingle();

      if(partnerError||!partnerProfile){
        await supabaseLogin.auth.signOut();
        return;
      }

      window.location.href="./dashboard.html";
    }
  }catch(error){
    console.error("Session check failed:",error);
  }
})();
</script>
</body>
</html>
