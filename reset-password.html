<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Set New Password | Select My Venue Partner CRM</title>
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
<style>
*{box-sizing:border-box}
html,body{margin:0;min-height:100%}
body{min-height:100vh;font-family:Inter,-apple-system,BlinkMacSystemFont,"Segoe UI",Arial,sans-serif;background:#071018;color:#fff}
.page{
  min-height:100vh;display:flex;align-items:center;justify-content:center;padding:24px;
  background:
    radial-gradient(circle at 50% 35%,rgba(21,154,140,.14),transparent 35%),
    linear-gradient(135deg,#050b12,#09131d 48%,#050b12);
}
.card{
  width:460px;max-width:100%;padding:40px 42px 34px;border-radius:26px;
  background:linear-gradient(145deg,rgba(18,30,44,.97),rgba(8,17,27,.98));
  border:1px solid rgba(255,255,255,.10);box-shadow:0 40px 100px rgba(0,0,0,.55)
}
.logo{
  width:76px;height:76px;margin:0 auto 20px;display:grid;place-items:center;border-radius:22px;
  background:linear-gradient(135deg,#23c4b5,#0d9286);color:#031416;font-size:21px;font-weight:950
}
h1{margin:0;text-align:center;font-size:25px}
.sub{margin:9px 0 25px;text-align:center;color:rgba(255,255,255,.55);font-size:13px;line-height:1.5}
.status{
  margin-bottom:18px;padding:12px 13px;border-radius:11px;border:1px solid rgba(255,255,255,.08);
  background:rgba(255,255,255,.035);font-size:12px;line-height:1.5;color:#b9c9ca;text-align:center
}
.status.good{border-color:rgba(99,230,190,.20);color:#63e6be;background:rgba(99,230,190,.05)}
.status.bad{border-color:rgba(255,143,143,.20);color:#ff9d9d;background:rgba(255,143,143,.05)}
.form{display:none}.form.ready{display:grid;gap:17px}
.field{display:grid;gap:8px}
label{font-size:11px;font-weight:800;letter-spacing:.1em;color:rgba(255,255,255,.68)}
input{
  width:100%;height:50px;padding:0 15px;border-radius:12px;border:1px solid rgba(255,255,255,.11);
  background:rgba(255,255,255,.045);color:#fff;outline:none;font-size:15px
}
input:focus{border-color:rgba(21,154,140,.85);box-shadow:0 0 0 3px rgba(21,154,140,.10)}
.rule{margin-top:-7px;color:rgba(255,255,255,.40);font-size:10px;line-height:1.45}
button{
  width:100%;height:50px;border:0;border-radius:12px;cursor:pointer;
  font-size:15px;font-weight:800;color:#fff;background:linear-gradient(135deg,#18a997,#087f73)
}
button:disabled{opacity:.55;cursor:not-allowed}
.message{min-height:20px;text-align:center;font-size:13px;line-height:1.45}
.message.error{color:#ff8f8f}.message.success{color:#63e6be}
.back{display:block;margin-top:18px;text-align:center;color:#31cbbb;text-decoration:none;font-size:13px;font-weight:700}
.back:hover{text-decoration:underline}
.note{margin-top:22px;padding-top:18px;border-top:1px solid rgba(255,255,255,.06);text-align:center;color:rgba(255,255,255,.34);font-size:10px}
@media(max-width:600px){.card{padding:34px 24px 28px;border-radius:22px}}
</style>
</head>
<body>
<main class="page">
  <section class="card">
    <div class="logo">SMV</div>
    <h1>Create a new password</h1>
    <p class="sub">Use the secure recovery link from your email to set a new Partner CRM password.</p>

    <div id="status" class="status">Verifying your secure recovery link…</div>

    <form id="resetForm" class="form" autocomplete="off">
      <div class="field">
        <label for="newPassword">NEW PASSWORD</label>
        <input id="newPassword" type="password" autocomplete="new-password" placeholder="Enter new password" required>
      </div>

      <div class="field">
        <label for="confirmPassword">CONFIRM NEW PASSWORD</label>
        <input id="confirmPassword" type="password" autocomplete="new-password" placeholder="Re-enter new password" required>
      </div>

      <div class="rule">Use at least 8 characters with an uppercase letter, lowercase letter, and number.</div>

      <button id="resetBtn" type="submit">Save New Password</button>
      <div id="message" class="message" role="alert" aria-live="polite"></div>
    </form>

    <a class="back" href="forgot-password.html">Request a new reset link</a>
    <div class="note">Select My Venue · Secure Venue Partner Portal</div>
  </section>
</main>

<script>
const SUPABASE_URL="https://uajqwyoqbbswkfiwosyw.supabase.co";
const SUPABASE_ANON_KEY="sb_publishable_hfiuO4ZRn4VZmEkrN2RV-A_lZX_R3z7";
const supabaseReset=window.supabase.createClient(
  SUPABASE_URL,
  SUPABASE_ANON_KEY,
  {
    auth:{
      storageKey:"smv-partner-crm-auth",
      persistSession:true,
      autoRefreshToken:true,
      detectSessionInUrl:true
    }
  }
);

const statusBox=document.getElementById("status");
const form=document.getElementById("resetForm");
const btn=document.getElementById("resetBtn");
const msg=document.getElementById("message");

let recoveryReady=false;
let recoveryEventSeen=false;

function showMessage(text,type=""){
  msg.textContent=text;
  msg.className="message "+type;
}
function setStatus(text,type=""){
  statusBox.textContent=text;
  statusBox.className="status "+type;
}
function enableRecovery(){
  if(recoveryReady)return;
  recoveryReady=true;
  setStatus("Recovery link verified. You can now create a new password.","good");
  form.classList.add("ready");
  // Remove tokens/codes from the visible address bar after Supabase has consumed them.
  history.replaceState({},document.title,"reset-password.html");
}
function hasRecoveryMarker(){
  const search=new URLSearchParams(window.location.search);
  const hash=new URLSearchParams((window.location.hash||"").replace(/^#/,""));
  return (
    search.get("type")==="recovery" ||
    hash.get("type")==="recovery" ||
    search.has("token_hash") ||
    search.has("code") ||
    hash.has("access_token")
  );
}

const arrivedFromRecovery=hasRecoveryMarker();

supabaseReset.auth.onAuthStateChange((event,session)=>{
  if(event==="PASSWORD_RECOVERY" && session){
    recoveryEventSeen=true;
    enableRecovery();
  }
});

(async function verifyRecovery(){
  if(!arrivedFromRecovery){
    setStatus("This page must be opened from a valid password-recovery email link.","bad");
    return;
  }

  // detectSessionInUrl processes the recovery tokens asynchronously.
  for(let i=0;i<12;i++){
    await new Promise(resolve=>setTimeout(resolve,250));
    const {data,error}=await supabaseReset.auth.getSession();
    if(!error && data?.session){
      enableRecovery();
      return;
    }
  }

  if(!recoveryEventSeen){
    setStatus("This recovery link is invalid or has expired. Please request a new reset link.","bad");
  }
})();

function validPassword(value){
  return value.length>=8 && /[a-z]/.test(value) && /[A-Z]/.test(value) && /\d/.test(value);
}

form.addEventListener("submit",async(e)=>{
  e.preventDefault();

  if(!recoveryReady){
    showMessage("Your recovery link has not been verified.","error");
    return;
  }

  const password=document.getElementById("newPassword").value;
  const confirm=document.getElementById("confirmPassword").value;

  if(!validPassword(password)){
    showMessage("Password must be at least 8 characters and include uppercase, lowercase, and a number.","error");
    return;
  }
  if(password!==confirm){
    showMessage("The two passwords do not match.","error");
    return;
  }

  btn.disabled=true;
  btn.textContent="Saving...";
  showMessage("");

  try{
    const {error}=await supabaseReset.auth.updateUser({password});

    if(error){
      console.error(error);
      showMessage(error.message||"Unable to update your password. Please request a new recovery link.","error");
      return;
    }

    showMessage("Password updated successfully. Returning to login…","success");
    await supabaseReset.auth.signOut({scope:"local"});
    setTimeout(()=>window.location.replace("login.html?reset=success"),700);
  }catch(error){
    console.error(error);
    showMessage("Unable to update your password. Please try again.","error");
  }finally{
    btn.disabled=false;
    btn.textContent="Save New Password";
  }
});
</script>
</body>
</html>
