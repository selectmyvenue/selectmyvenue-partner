name: Partner CRM V2 regression checks
on:
  pull_request:
    branches: [main]
  push:
    branches: [feat/smv-ai-matching-v2]
jobs:
  partner-availability:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Validate partner availability workflow
        run: node tests/partner-availability.cjs
