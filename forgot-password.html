<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Forgot Password | Select My Venue</title>

  <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>

  <style>
    * {
      box-sizing: border-box;
    }

    body {
      margin: 0;
      min-height: 100vh;
      font-family: Arial, Helvetica, sans-serif;
      background: linear-gradient(135deg, #061116, #0b2025);
      display: flex;
      align-items: center;
      justify-content: center;
      color: #ffffff;
      padding: 20px;
    }

    .card {
      width: 100%;
      max-width: 500px;
      background: #101d28;
      border: 1px solid #2c3b48;
      border-radius: 28px;
      padding: 48px 42px;
    }

    .brand {
      text-align: center;
      margin-bottom: 40px;
    }

    .brand h1 {
      margin: 0 0 8px;
      font-size: 30px;
    }

    .brand p {
      margin: 0;
      color: #9ba6af;
    }

    h2 {
      margin: 0 0 10px;
      font-size: 25px;
    }

    .description {
      color: #9ba6af;
      line-height: 1.6;
      margin-bottom: 28px;
    }

    label {
      display: block;
      margin-bottom: 10px;
      font-size: 13px;
      font-weight: 700;
      letter-spacing: 1px;
      color: #bdc4ca;
    }

    input {
      width: 100%;
      padding: 18px;
      border-radius: 14px;
      border: 1px solid #354451;
      background: #192632;
      color: #ffffff;
      font-size: 16px;
      outline: none;
    }

    input:focus {
      border-color: #18aa9d;
    }

    button {
      width: 100%;
      margin-top: 24px;
      padding: 18px;
      border: 0;
      border-radius: 14px;
      background: #18aa9d;
      color: white;
      font-size: 17px;
      font-weight: 700;
      cursor: pointer;
    }

    button:disabled {
      opacity: 0.65;
      cursor: not-allowed;
    }

    #message {
      margin-top: 20px;
      text-align: center;
      line-height: 1.5;
      min-height: 24px;
    }

    .back {
      display: block;
      margin-top: 30px;
      text-align: center;
      color: #49c9bd;
      text-decoration: none;
      font-weight: 600;
    }
  </style>
</head>

<body>

  <div class="card">

    <div class="brand">
      <h1>Select My Venue</h1>
      <p>Venue Partner CRM</p>
    </div>

    <h2>Forgot your password?</h2>

    <div class="description">
      Enter your registered email address. We'll send you a secure link to create a new password.
    </div>

    <form id="forgotForm">

      <label for="email">EMAIL ADDRESS</label>

      <input
        id="email"
        type="email"
        placeholder="Enter your registered email"
        autocomplete="email"
        required
      />

      <button id="sendButton" type="submit">
        Send Reset Link
      </button>

      <div id="message"></div>

    </form>

    <a class="back" href="login.html">
      ← Back to Partner Login
    </a>

  </div>

  <script>
    const SUPABASE_URL =
      "https://uajqwyoqbbswkfiwosyw.supabase.co";

    const SUPABASE_ANON_KEY =
      "sb_publishable_hfiuO4ZRn4VZmEkrN2RV-A_lZX_R3z7";

    const supabaseClient = window.supabase.createClient(
      SUPABASE_URL,
      SUPABASE_ANON_KEY,
      {
        auth: {
          storageKey: "smv-partner-crm-auth",
          persistSession: true,
          autoRefreshToken: true,
          detectSessionInUrl: true
        }
      }
    );

    const form = document.getElementById("forgotForm");
    const emailInput = document.getElementById("email");
    const button = document.getElementById("sendButton");
    const message = document.getElementById("message");

    form.addEventListener("submit", async function (event) {
      event.preventDefault();

      const email = emailInput.value.trim();

      if (!email) {
        message.style.color = "#ff7070";
        message.textContent = "Please enter your email address.";
        return;
      }

      button.disabled = true;
      button.textContent = "Sending...";
      message.textContent = "";

      try {

        const { error } =
          await supabaseClient.auth.resetPasswordForEmail(
            email,
            {
              redirectTo:
                "https://partner.selectmyvenue.com/reset-password.html"
            }
          );

        if (error) {
          throw error;
        }

        message.style.color = "#4ee0ae";
        message.textContent =
          "Reset link sent. Please check your email inbox and spam folder.";

        emailInput.value = "";

      } catch (error) {

        console.error(error);

        message.style.color = "#ff7070";
        message.textContent =
          error.message || "Unable to send reset link. Please try again.";

      } finally {

        button.disabled = false;
        button.textContent = "Send Reset Link";

      }
    });
  </script>

</body>
</html>
