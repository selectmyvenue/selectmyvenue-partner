<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Forgot Password | Select My Venue Partner CRM</title>
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
<style>
*{box-sizing:border-box}
html,body{margin:0;min-height:100%}
body{min-height:100vh;font-family:Inter,-apple-system,BlinkMacSystemFont,"Segoe UI",Arial,sans-serif;background:#071018;color:#fff}
.page{
  min-height:100vh;display:flex;align-items:center;justify-content:center;padding:24px;
  background:
    radial-gradient(circle at 50% 35%,rgba(21,154,140,.14),transparent 35%),
    linear-gradient(135deg,#050b12,#09131d 48%,#050b12);
}
.card{
  width:440px;max-width:100%;padding:40px 42px 34px;border-radius:26px;
  background:linear-gradient(145deg,rgba(18,30,44,.97),rgba(8,17,27,.98));
  border:1px solid rgba(255,255,255,.10);box-shadow:0 40px 100px rgba(0,0,0,.55);
}
.logo{display:block;width:250px;max-width:100%;height:64px;margin:0 auto 22px;object-fit:contain;filter:drop-shadow(0 10px 22px rgba(0,0,0,.3))}
h1{margin:0;text-align:center;font-size:25px}
.sub{margin:9px 0 28px;text-align:center;color:rgba(255,255,255,.55);font-size:13px;line-height:1.5}
.field{display:grid;gap:8px}
label{font-size:11px;font-weight:800;letter-spacing:.1em;color:rgba(255,255,255,.68)}
input{
  width:100%;height:50px;padding:0 15px;border-radius:12px;border:1px solid rgba(255,255,255,.11);
  background:rgba(255,255,255,.045);color:#fff;outline:none;font-size:15px
}
input:focus{border-color:rgba(21,154,140,.85);box-shadow:0 0 0 3px rgba(21,154,140,.10)}
button{
  width:100%;height:50px;margin-top:20px;border:0;border-radius:12px;cursor:pointer;
  font-size:15px;font-weight:800;color:#fff;background:linear-gradient(135deg,#18a997,#087f73)
}
button:disabled{opacity:.55;cursor:not-allowed}
.message{min-height:22px;margin-top:14px;text-align:center;font-size:13px;line-height:1.5}
.message.error{color:#ff8f8f}.message.success{color:#63e6be}
.back{display:block;margin-top:18px;text-align:center;color:#31cbbb;text-decoration:none;font-size:13px;font-weight:700}
.back:hover{text-decoration:underline}
.note{margin-top:22px;padding-top:18px;border-top:1px solid rgba(255,255,255,.06);text-align:center;color:rgba(255,255,255,.34);font-size:10px}
@media(max-width:600px){.card{padding:34px 24px 28px;border-radius:22px}}
</style>
</head>
<body>
<main class="page">
  <section class="card">
    <img class="logo" src="https://selectmyvenue.com/logo.png" alt="Select My Venue">
    <h1>Reset your password</h1>
    <p class="sub">Enter the email used for your Venue Partner CRM account. We’ll email you a secure recovery link.</p>

    <form id="forgotForm">
      <div class="field">
        <label for="email">EMAIL ADDRESS</label>
        <input id="email" type="email" autocomplete="email" placeholder="Enter your email" required>
      </div>
      <button id="sendBtn" type="submit">Send Reset Link</button>
      <div id="message" class="message" role="alert" aria-live="polite"></div>
    </form>

    <a class="back" href="login.html">← Back to Partner Login</a>
    <div class="note">Select My Venue · Secure Venue Partner Portal</div>
  </section>
</main>

<script>
const SUPABASE_URL="https://uajqwyoqbbswkfiwosyw.supabase.co";
const SUPABASE_ANON_KEY="sb_publishable_hfiuO4ZRn4VZmEkrN2RV-A_lZX_R3z7";
const supabaseForgot=window.supabase.createClient(
  SUPABASE_URL,
  SUPABASE_ANON_KEY,
  {
    auth:{
      storageKey:"smv-partner-crm-auth",
      persistSession:true,
      autoRefreshToken:true,
      detectSessionInUrl:true
    }
  }
);

const form=document.getElementById("forgotForm");
const btn=document.getElementById("sendBtn");
const msg=document.getElementById("message");

function showMessage(text,type=""){
  msg.textContent=text;
  msg.className="message "+type;
}

form.addEventListener("submit",async(e)=>{
  e.preventDefault();
  const email=document.getElementById("email").value.trim();
  if(!email)return;

  btn.disabled=true;
  btn.textContent="Sending...";
  showMessage("");

  try{
    const {error}=await supabaseForgot.auth.resetPasswordForEmail(email,{
      redirectTo:"https://partner.selectmyvenue.com/reset-password.html"
    });

    if(error){
      console.error(error);
      if(String(error.message||"").toLowerCase().includes("rate")){
        showMessage("Too many reset requests. Please wait a few minutes and try again.","error");
      }else{
        showMessage("Unable to send the reset email right now. Please try again.","error");
      }
      return;
    }

    // Deliberately generic: does not reveal whether an account exists.
    showMessage("If this email is registered, a secure password-reset link has been sent. Please check your inbox and spam folder.","success");
    form.reset();
  }catch(error){
    console.error(error);
    showMessage("Unable to send the reset email right now. Please try again.","error");
  }finally{
    btn.disabled=false;
    btn.textContent="Send Reset Link";
  }
});
</script>
</body>
</html>
